name: CI - Brigada Santa Eugènia

on:
  push:
    branches: [ main, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Verificació i Bateria de Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Configuració de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configuració de Java per als emuladors Firebase
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instal·lació de dependències
        run: npm ci

      - name: Instal·lació de Firebase CLI
        run: npm install -g firebase-tools

      - name: Compilació d'estils Tailwind CSS
        run: npm run build:css

      - name: Execució de la suite de proves estàtiques i de components
        run: npm test

      - name: Execució de proves de regles i integració amb emuladors
        run: firebase emulators:exec --only auth,firestore "npm run test:rules && npm run test:e2e"
